apiVersion: apps/v1
kind: Deployment
metadata:
  name: job-app
  labels:
    app: job-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: job-app
  template:
    metadata:
      labels:
        app: job-app
    spec:
      containers:
        - name: app
          image: job-search:0.2
          imagePullPolicy: Never
          ports:
            - containerPort: 8000
          env:
            - name: REDIS_HOST
              value: "redis"
            - name: REDIS_PORT
              value: "6379"
          resources:
            requests:
              memory: "512Mi"
              cpu: "200m"
            limits:
              memory: "2Gi"
              cpu: "1000m"
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 90
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 60
            periodSeconds: 10
            timeoutSeconds: 5