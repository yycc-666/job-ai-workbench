services:
  redis:
    image: redis:7-alpine
    container_name: job-redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    # 不映射端口到宿主，避免和 Memurai 冲突

  app:
    image: job-search:0.1
    container_name: job-app
    restart: unless-stopped
    ports:
      - "8888:8000"
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      redis:
        condition: service_healthy